# Corpus manifest input.
#
# One entry per file in data/raw/. document_id is the filename stem.
#
# nas.gov.sg is behind AWS WAF Bot Control (see docs/collection-blocked.md), so
# nothing here is fetched. The transcripts were saved by hand into data/raw/,
# which is gitignored and never committed: NAS Archives Online records are
# copyright-protected.
#
# url is null for every document on purpose. The record URLs are filled in by
# hand. Nothing in this project invents a URL.
#
# FLAGS, and what they are for
#   translated         : the text is an official translation, not Lee speaking
#                        English. An answer using it must say so.
#   verbatim           : the text is a transcript of what was said. false means
#                        it is a summary written by someone else, so it may be
#                        retrieved but no direct quote may be taken from it.
#   third_party_quotes : the text quotes other people at length. Those words are
#                        not Lee's and are stripped before indexing.
#   speaker_filter     : for dialogue, the only turn prefix to keep.
#
# Titles are copied from the heading printed at the top of each transcript.

